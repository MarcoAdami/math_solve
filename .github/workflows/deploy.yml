name: Deploy Leptos App to Cloudflare Pages

on:
  push:
    branches:
      - main # Cambia in 'master' se il tuo ramo principale si chiama master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa la toolchain Rust e il target WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache delle dipendenze Cargo
        uses: Swatinem/rust-cache@v2

      - name: Installa Trunk
        run: cargo install trunk --locked

      - name: Build dell'app con Trunk
        run: trunk build --release

      - name: Deploy su Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "old-moon-d380"
          directory: "dist"