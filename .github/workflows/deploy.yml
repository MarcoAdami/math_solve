name: Deploy Leptos App to Cloudflare Pages

on:
  push:
    branches:
      - new_layout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Le 3 repo private vengono scaricate affiancate, esattamente come in
      # locale: le dipendenze `path = "../..."` funzionano identiche in CI.
      - name: Checkout math_solve
        uses: actions/checkout@v4
        with:
          path: math_solve

      - name: Checkout user_algebra (privata)
        uses: actions/checkout@v4
        with:
          repository: MarcoAdami/user_algebra
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: user_algebra

      - name: Checkout pratt_parser_rust (privata)
        uses: actions/checkout@v4
        with:
          repository: MarcoAdami/pratt_parser_rust
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: pratt_parser_rust

      - name: Installa la toolchain Rust e il target WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache delle dipendenze Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: math_solve

      - name: Installa Trunk
        run: cargo install trunk --locked

      - name: Build dell'app con Trunk
        working-directory: math_solve
        run: trunk build --release

      # Idempotente: se il progetto esiste già, il comando fallisce e si prosegue
      - name: Crea il progetto Pages se non esiste
        run: npx wrangler@3 pages project create move2solve --production-branch=new_layout || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy su Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy math_solve/dist --project-name=move2solve --branch=new_layout
