[build]
command = "git config --global url.\"https://${GITHUB_TOKEN}@github.com/MarcoAdami/user_algebra.git\".insteadOf \"https://github.com/MarcoAdami/user_algebra.git\" rustup target add wasm32-unknown-unknown && cargo install trunk --locked && trunk build --release"
publish = "dist"

[build.environment]
RUST_VERSION = "stable"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200